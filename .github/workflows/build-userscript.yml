name: Build and release userscript

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "test/**"
      - ".github/workflows/build-userscript.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "test/**"
      - ".github/workflows/build-userscript.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omnigpt-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build, verify and test
        run: npm run check

      - name: Real Chromium clipboard, export and lightweight UI regressions
        shell: bash
        run: |
          python3 -m venv /tmp/omnigpt-browser-tests
          source /tmp/omnigpt-browser-tests/bin/activate
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
          python test/browser-regression.py
          python test/browser-v030.py

      - name: Read release version
        id: release
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require a version bump for distributable changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            if ! git diff --quiet "v${VERSION}" -- OmniGPT.user.js; then
              echo "::error::Distributable differs from the existing v${VERSION} tag. Bump package.json before publishing."
              exit 1
            fi
          fi

      - name: Keep generated userscript in sync
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet -- OmniGPT.user.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OmniGPT.user.js
          git commit -m "Build OmniGPT userscript"
          git push

      - name: Create version tag and GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git fetch --tags --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            git tag -a "v${VERSION}" -m "OmniGPT v${VERSION}"
            git push origin "v${VERSION}"
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} already released; not overwriting published assets."
          else
            gh release create "v${VERSION}" OmniGPT.user.js \
              --title "OmniGPT v${VERSION}" \
              --verify-tag --generate-notes
          fi
